<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeynep World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #080810;
  --bg2:       #0e0e1a;
  --bg3:       #141424;
  --surface:   #18182c;
  --surface2:  #201e38;
  --border:    #2c2848;
  --accent:    #c4aaff;
  --accent2:   #7b5ef8;
  --accent3:   #ff6eb0;
  --text:      #ede8ff;
  --text2:     #9988cc;
  --text3:     #554e88;
  --pin:       #ff3d6b;
  --shadow:    0 8px 32px rgba(123,94,248,0.22);
  --cork:      linear-gradient(135deg,#161628 0%,#1a1830 100%);
  --tape:      rgba(196,170,255,0.14);
  --fd:        'Playfair Display', serif;
  --fh:        'Caveat', cursive;
  --fb:        'DM Sans', sans-serif;
  --fbb:       'Bebas Neue', sans-serif;
  --bubble-bg: #1e1c34;
  --bubble-alt:#221e3a;
}
[data-theme="pastel"] {
  --bg:        #fdf5f0; --bg2: #fef9f5; --bg3: #fff0e8; --surface: #fff6f1; --surface2: #ffe8de;
  --border:    #f0cfc2; --accent: #d4789a; --accent2: #b55a80; --accent3: #f0a882; --text: #4a2e3c;
  --text2:     #8a6070; --text3: #c0a0aa; --pin: #d05878; --cork: linear-gradient(135deg,#fef0e8 0%,#fde8e0 100%);
  --bubble-bg: #fff0ea; --bubble-alt:#ffe4da;
}
[data-theme="minimal"] {
  --bg:        #f6f5f2; --bg2: #fafaf8; --bg3: #efefec; --surface: #ffffff; --surface2: #f0efec;
  --border:    #dddbd8; --accent: #1a1a1a; --accent2: #444444; --accent3: #888888; --text: #111111;
  --text2:     #555555; --text3: #bbbbbb; --pin: #222222; --cork: linear-gradient(135deg,#edece8 0%,#e8e6e2 100%);
  --bubble-bg: #f8f7f4; --bubble-alt:#f0efe9;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--fb); background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .7s,color .4s;
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

header{
  position:sticky;top:0;z-index:200; height:58px;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid var(--border); backdrop-filter:blur(24px);
}
.logo{
  font-family:var(--fd); font-size:1.45rem; font-style:italic; color:var(--text);
  display:flex;align-items:center;gap:6px; user-select:none;
}
.logo em{color:var(--accent);font-style:normal;}
.logo .dot{color:var(--accent3);font-size:1.6rem;line-height:1;}

.theme-bar{
  display:flex;align-items:center;gap:6px; background:var(--surface);
  border:1px solid var(--border); border-radius:50px;padding:5px 8px;
}
.th-btn{
  border:none;cursor:pointer;border-radius:50px;padding:5px 13px;
  font-family:var(--fb);font-size:.7rem;font-weight:500;text-transform:uppercase;
  color:var(--text3);background:transparent;transition:all .25s;
}
.th-btn:hover{color:var(--text);}
.th-btn.on{background:var(--accent);color:var(--bg);font-weight:700;}

.wrapper{
  display:grid; grid-template-columns:1fr 340px; min-height:calc(100vh - 58px);
}

.board-col{
  display:grid; grid-template-rows:1fr auto; border-right:1px solid var(--border);
}

/* Corkboard with absolute positioning for draggable items */
.corkboard{
  padding:0; background:var(--cork); min-height:520px; position:relative; overflow:hidden;
}

.board-items{
  position:relative; width:100%; height:100%; min-height:600px;
}

.board-empty{
  position:absolute;inset:0; display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:var(--text3);font-family:var(--fh);font-size:1.2rem; pointer-events:none;opacity:.7; z-index:0;
}

/* Draggable Items */
.pinned-photo, .q-bubble, .envelope-item {
  position: absolute; cursor: grab; user-select: none; z-index: 10;
  transition: box-shadow .2s;
}
.pinned-photo:active, .q-bubble:active, .envelope-item:active { cursor: grabbing; }

.pinned-photo{
  animation:pinDrop .45s cubic-bezier(.34,1.56,.64,1) both;
  --rot:2deg; width: 160px;
}
@keyframes pinDrop{
  from{transform:scale(.4) rotate(var(--rot));opacity:0;}
  to{transform:scale(1) rotate(var(--rot));opacity:1;}
}

.photo-frame{
  background:#fff; padding:9px 9px 30px; transform:rotate(var(--rot));
  box-shadow:3px 5px 18px rgba(0,0,0,.3); max-width:158px;
}
.photo-frame img{ width:140px;height:140px;object-fit:cover;display:block;pointer-events:none; }
.photo-caption{ font-family:var(--fh);font-size:.8rem;color:#555;text-align:center;padding:5px 2px 0; }

.pin-tack{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;
}
.pin-head{
  width:14px;height:14px;background:radial-gradient(circle at 38% 32%,#ff99aa,var(--pin));
  border-radius:50%;border:1.5px solid rgba(0,0,0,.22);
}
.pin-shaft{ width:2px;height:9px;background:linear-gradient(to bottom,#ccc,#888);margin:0 auto; }

.photo-del, .q-del, .env-del{
  position:absolute;top:-7px;right:-7px; width:22px;height:22px; background:#ff3d6b;
  border:none;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:none;
  align-items:center;justify-content:center;z-index:40;
}
.pinned-photo:hover .photo-del, .q-bubble:hover .q-del, .envelope-item:hover .env-del { display:flex; }

.q-bubble{
  background:var(--bubble-bg); border:1px solid var(--border); border-radius:20px;
  padding:15px 18px 12px; max-width:260px; min-width:160px;
}
.q-text{ font-family:var(--fh);font-size:1.05rem;color:var(--text);line-height:1.55; }
.q-footer{ display:flex;align-items:center;justify-content:space-between;margin-top:7px; }
.q-stars{ color:var(--accent3);font-size:.72rem;letter-spacing:2px; }

/* Envelope Item */
.envelope-box {
  background: #f4e8c1; color: #4a3b2c; padding: 12px 18px; border-radius: 6px;
  font-family: var(--fh); font-size: 1.1rem; box-shadow: 3px 5px 15px rgba(0,0,0,0.25);
  border: 1px dashed #c2b084; text-align: center; width: 150px;
}

.add-zones{ display:grid; grid-template-columns:repeat(5, 1fr); border-top:1px solid var(--border); background:var(--bg2); }
.add-zone{
  height:70px; display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer; border:none;border-right:1px solid var(--border); background:transparent;color:var(--text3);
  font-family:var(--fh); font-size:0.85srem; gap:3px; transition:all .2s;
}
.add-zone:hover{ background:var(--surface); color:var(--accent); }

aside.sidebar{ display:flex;flex-direction:column; background:var(--bg2);overflow-y:auto; }

.panel{ padding:18px; border-bottom:1px solid var(--border); flex-shrink:0; }
.panel-title{ font-family:var(--fd);font-size:1.1rem;font-style:italic;color:var(--text);margin-bottom:10px;display:flex;justify-content:between;align-items:center; }

/* Ambient Sounds Bar */
.ambient-row{ display:flex; gap:6px; margin-bottom:10px; }
.amb-btn{
  flex:1; padding:6px; background:var(--surface); border:1px solid var(--border);
  border-radius:4px; font-size:0.72rem; color:var(--text2); cursor:pointer; text-align:center;
}
.amb-btn.active { background: var(--accent); color: var(--bg); font-weight: 700; border-color: var(--accent); }

/* Countdowns & Capsules Lists */
.mini-list{ max-height:130px; overflow-y:auto; display:flex;flex-direction:column;gap:5px; margin-bottom:8px; }
.mini-item{ background:var(--surface); border:1px solid var(--border); padding:6px 10px; border-radius:4px; font-size:0.75rem; display:flex;justify-content:between;align-items:center; }

/* AI Panel */
.ai-panel{ padding:18px; border-bottom:1px solid var(--border); display:flex;flex-direction:column; flex:1; min-height:260px; }
.ai-chat-box{
  flex:1; background:var(--bg); border:1px solid var(--border); border-radius:6px;
  padding:10px; max-height:180px; overflow-y:auto; display:flex;flex-direction:column;gap:8px; margin-bottom:8px;
}
.ai-msg{ font-size:0.78rem; padding:7px 9px; border-radius:6px; line-height:1.4; max-width:90%; word-break:break-word; }
.ai-msg.user{ background:var(--surface2); color:var(--text); align-self:flex-end; }
.ai-msg.assistant{ background:var(--surface); color:var(--text2); align-self:flex-start; border:1px solid var(--border); }
.ai-msg img{ width:100%; max-height:120px; object-fit:cover; border-radius:4px; margin-top:5px; display:block; }

.ai-input-row{ display:flex; gap:5px; align-items:center; }
.ai-input{
  flex:1; background:var(--surface); border:1px solid var(--border); border-radius:4px;
  padding:7px 9px; font-size:0.75rem; color:var(--text); outline:none;
}
.ai-send-btn{ padding:7px 10px; background:var(--accent); border:none; border-radius:4px; color:var(--bg); font-weight:700; font-size:0.7rem; cursor:pointer; }

/* Modals */
.overlay{ position:fixed;inset:0; background:rgba(0,0,0,.72); display:none;align-items:center;justify-content:center; z-index:500; backdrop-filter:blur(10px); }
.overlay.open{display:flex;}
.modal{ background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;width:320px; box-shadow:0 28px 70px rgba(0,0,0,.55); }
.modal h3{ font-family:var(--fd);font-size:1.2rem;font-style:italic;color:var(--text);margin-bottom:14px; }
.modal input,.modal textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  padding:10px;font-size:0.9rem;color:var(--text);outline:none;margin-bottom:10px;resize:none;
}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.m-cancel{ padding:8px 14px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text2);cursor:pointer;font-size:0.75rem;}
.m-ok{ padding:8px 18px;background:var(--accent);border:none;border-radius:4px;color:var(--bg);font-weight:700;cursor:pointer;font-size:0.75rem;}

.toast{ position:fixed;bottom:20px;right:20px; background:var(--surface);border:1px solid var(--border); border-radius:8px;padding:12px 16px;font-family:var(--fh);font-size:0.95rem;color:var(--text); z-index:1000;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body data-theme="midnight">

<header>
  <div class="logo"><span class="dot">✦</span>Zeynep <em>World</em></div>
  <div class="theme-bar">
    <button class="th-btn on" data-t="midnight" onclick="setTheme('midnight',this)">🌙 Midnight</button>
    <button class="th-btn" data-t="pastel" onclick="setTheme('pastel',this)">🌸 Pastel</button>
    <button class="th-btn" data-t="minimal" onclick="setTheme('minimal',this)">🤍 Minimal</button>
  </div>
</header>

<div class="wrapper">
  <div class="board-col">
    <!-- Corkboard -->
    <div class="corkboard" id="corkboard">
      <div class="board-items" id="board-items">
        <div class="board-empty" id="board-empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>burası senin dünyan ✦ (eşyaları sürükleyebilirsin)</span>
        </div>
      </div>
    </div>

    <!-- Action Toolbar (Add Zones) -->
    <div class="add-zones">
      <button class="add-zone" onclick="document.getElementById('file-in').click()">📷 <span>Foto</span></button>
      <button class="add-zone" onclick="openQuoteModal()">💬 <span>Söz</span></button>
      <button class="add-zone" onclick="openLetterModal()">💌 <span>Mektup</span></button>
      <button class="add-zone" onclick="openCountdownModal()">⏳ <span>Sayaç</span></button>
      <button class="add-zone" onclick="openCapsuleModal()">📦 <span>Kapsül</span></button>
    </div>
  </div>

  <aside class="sidebar">
    <!-- Ambient Sounds -->
    <div class="panel">
      <h3 class="panel-title">🎧 Ortam Sesleri</h3>
      <div class="ambient-row">
        <button class="amb-btn" onclick="toggleAmb('rain', this)">🌧️ Yağmur</button>
        <button class="amb-btn" onclick="toggleAmb('fire', this)">🔥 Şömine</button>
        <button class="amb-btn" onclick="toggleAmb('cafe', this)">☕ Kafe</button>
      </div>
    </div>

    <!-- Countdowns Panel -->
    <div class="panel">
      <h3 class="panel-title">⏳ Geri Sayımlar</h3>
      <div class="mini-list" id="countdown-list"></div>
    </div>

    <!-- AI Assistant Panel -->
    <div class="ai-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 class="panel-title" id="ai-title" style="margin:0;">✦ 67</h3>
        <button onclick="openAiSettingsModal()" style="background:none;border:none;color:var(--text3);cursor:pointer;">⚙️</button>
      </div>
      <div class="ai-chat-box" id="ai-chat-box">
        <div class="ai-msg assistant">Selam! Ben 67. Bana bir şeyler yazabilir veya çizdirebilirsin ✦</div>
      </div>
      <div class="ai-input-row">
        <input class="ai-input" id="ai-input" type="text" placeholder="Mesaj yaz veya çizdir..." onkeydown="if(event.key==='Enter')sendAiMsg()">
        <button class="ai-send-btn" onclick="sendAiMsg()">YAZ</button>
      </div>
    </div>
  </aside>
</div>

<!-- Hidden inputs & Modals -->
<input type="file" id="file-in" accept="image/*" multiple onchange="handleFiles(event)" style="display:none">

<div class="overlay" id="ph-modal">
  <div class="modal">
    <h3>fotoğrafı iğnele 📌</h3>
    <input type="text" id="ph-caption" placeholder="başlık (isteğe bağlı)" maxlength="60">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal('ph-modal')">iptal</button>
      <button class="m-ok" onclick="confirmPhoto()">iğnele!</button>
    </div>
  </div>
</div>

<div class="overlay" id="qu-modal">
  <div class="modal">
    <h3>havalı söz ✦</h3>
    <textarea id="qu-text" placeholder="bir şeyler yaz..." maxlength="300" style="height:80px;"></textarea>
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal('qu-modal')">iptal</button>
      <button class="m-ok" onclick="confirmQuote()">ekle!</button>
    </div>
  </div>
</div>

<!-- Letter Modal -->
<div class="overlay" id="letter-modal">
  <div class="modal">
    <h3>geleceğe mektup 💌</h3>
    <input type="text" id="let-title" placeholder="Mektup Başlığı">
    <textarea id="let-content" placeholder="Gelecekteki kendine ya da arkadaşına not..." style="height:70px;"></textarea>
    <label style="font-size:0.75rem;color:var(--text2);">Açılacağı Tarih:</label>
    <input type="date" id="let-date">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal('letter-modal')">iptal</button>
      <button class="m-ok" onclick="confirmLetter()">zarfı kilitle</button>
    </div>
  </div>
</div>

<!-- Countdown Modal -->
<div class="overlay" id="cd-modal">
  <div class="modal">
    <h3>geri sayım ekle ⏳</h3>
    <input type="text" id="cd-title" placeholder="Örn: Yılbaşı / Buluşma">
    <input type="date" id="cd-date">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal('cd-modal')">iptal</button>
      <button class="m-ok" onclick="confirmCountdown()">başlat</button>
    </div>
  </div>
</div>

<!-- Capsule Modal -->
<div class="overlay" id="cap-modal">
  <div class="modal">
    <h3>anı kapsülü 📦</h3>
    <input type="text" id="cap-month" placeholder="Örn: Kasım 2026 Anıları">
    <textarea id="cap-note" placeholder="Bu ayın özeti, hislerin..." style="height:70px;"></textarea>
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal('cap-modal')">iptal</button>
      <button class="m-ok" onclick="confirmCapsule()">kapsülü mühürle</button>
    </div>
  </div>
</div>

<!-- AI Settings Modal -->
<div class="overlay" id="ai-settings-modal">
  <div class="modal">
    <h3>yapay zeka ayarı ✦</h3>
    <input type="text" id="ai-name-input" placeholder="Asistan Adı (Örn: 67)">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal('ai-settings-modal')">iptal</button>
      <button class="m-ok" onclick="saveAiSettings()">kaydet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let aiName = '67';
let pendingFile = null;

// Ambient Sound Players
let currentAudio = null;
const ambUrls = {
  rain: 'https://cdn.pixabay.com/download/audio/2021/08/09/audio_0344d56d7e.mp3?filename=rain-and-thunder-nature-sounds-7595.mp3',
  fire: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c38392fb.mp3?filename=campfire-crackles-11915.mp3',
  cafe: 'https://cdn.pixabay.com/download/audio/2022/05/16/audio_db327fbc41.mp3?filename=coffee-shop-ambience-11005.mp3'
};

function toggleAmb(type, btn) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
    document.querySelectorAll('.amb-btn').forEach(b => b.classList.remove('active'));
    if (btn.classList.contains('active')) return;
  }
  if (ambUrls[type]) {
    currentAudio = new Audio(ambUrls[type]);
    currentAudio.loop = true;
    currentAudio.play().catch(() => {});
    btn.classList.add('active');
  }
}

async function init() {
  const savedTheme = localStorage.getItem('zw_theme') || 'midnight';
  setTheme(savedTheme, document.querySelector(`[data-t="${savedTheme}"]`));

  await Promise.all([loadPhotos(), loadQuotes(), loadLetters(), loadCountdowns(), loadAiSettings()]);
  updateEmpty();
}

function setTheme(name, btn) {
  document.body.setAttribute('data-theme', name);
  document.querySelectorAll('.th-btn').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  localStorage.setItem('zw_theme', name);
}

// ── DRAG & DROP ENGINE ────────────────────────────────────────────────────────
function makeDraggable(el, id, endpoint) {
  let isDragging = false, startX, startY, initialX, initialY;

  el.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    initialX = el.offsetLeft;
    initialY = el.offsetTop;
    el.style.zIndex = 100;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    el.style.left = (initialX + dx) + 'px';
    el.style.top = (initialY + dy) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    el.style.zIndex = 10;
    // Save new position to Supabase
    fetch(`${API}/api/${endpoint}/${id}/pos`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ x: el.offsetLeft, y: el.offsetTop })
    });
  });
}

// ── PHOTOS ────────────────────────────────────────────────────────────────────
async function loadPhotos() {
  const res = await fetch(`${API}/api/photos`);
  const photos = await res.json();
  photos.forEach(renderPhoto);
}

function handleFiles(e) {
  if (e.target.files[0]) {
    pendingFile = e.target.files[0];
    document.getElementById('ph-caption').value = '';
    document.getElementById('ph-modal').classList.add('open');
  }
  e.target.value = '';
}

async function confirmPhoto() {
  if (!pendingFile) return;
  const caption = document.getElementById('ph-caption').value.trim();
  const fd = new FormData();
  fd.append('image', pendingFile);
  fd.append('caption', caption);

  closeModal('ph-modal');
  showToast('yükleniyor... 📌');

  const res = await fetch(`${API}/api/photos`, { method: 'POST', body: fd });
  if (res.ok) {
    const photo = await res.json();
    renderPhoto(photo);
    updateEmpty();
    showToast('iğnelendi! 📌');
  }
  pendingFile = null;
}

function renderPhoto(p) {
  const items = document.getElementById('board-items');
  const el = document.createElement('div');
  el.className = 'pinned-photo' + (p.taped ? ' taped' : '');
  el.style.left = (p.x || (Math.random() * 400 + 50)) + 'px';
  el.style.top = (p.y || (Math.random() * 300 + 50)) + 'px';
  el.style.setProperty('--rot', p.rot + 'deg');

  el.innerHTML = `
    <div class="pin-tack"><div class="pin-head"></div><div class="pin-shaft"></div></div>
    <button class="photo-del" onclick="delPhoto('${p.id}',this)">✕</button>
    <div class="photo-frame">
      <img src="${p.url}" alt="" loading="lazy">
      ${p.caption ? `<div class="photo-caption">${esc(p.caption)}</div>` : ''}
    </div>`;
  items.appendChild(el);
  makeDraggable(el, p.id, 'photos');
}

async function delPhoto(id, btn) {
  const el = btn.closest('.pinned-photo');
  await fetch(`${API}/api/photos/${id}`, { method: 'DELETE' });
  el.remove();
  updateEmpty();
}

// ── QUOTES ────────────────────────────────────────────────────────────────────
async function loadQuotes() {
  const res = await fetch(`${API}/api/quotes`);
  const quotes = await res.json();
  quotes.forEach(renderQuote);
}

function openQuoteModal() {
  document.getElementById('qu-text').value = '';
  document.getElementById('qu-modal').classList.add('open');
}

async function confirmQuote() {
  const text = document.getElementById('qu-text').value.trim();
  if (!text) return;
  closeModal('qu-modal');

  const res = await fetch(`${API}/api/quotes`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (res.ok) {
    const q = await res.json();
    renderQuote(q);
    updateEmpty();
    showToast('söz eklendi ✦');
  }
}

function renderQuote(q) {
  const items = document.getElementById('board-items');
  const el = document.createElement('div');
  el.className = `q-bubble ${q.style || ''}`;
  el.style.left = (q.x || (Math.random() * 400 + 50)) + 'px';
  el.style.top = (q.y || (Math.random() * 300 + 50)) + 'px';

  const stars = '★'.repeat(q.stars || 3) + '☆'.repeat(5 - (q.stars || 3));
  el.innerHTML = `
    <div class="q-text">${esc(q.text)}</div>
    <div class="q-footer"><span class="q-stars">${stars}</span><button class="q-del" onclick="delQuote('${q.id}',this)">✕</button></div>`;
  items.appendChild(el);
  makeDraggable(el, q.id, 'quotes');
}

async function delQuote(id, btn) {
  const el = btn.closest('.q-bubble');
  await fetch(`${API}/api/quotes/${id}`, { method: 'DELETE' });
  el.remove();
  updateEmpty();
}

// ── LETTERS (Mektup Kutusu) ───────────────────────────────────────────────────
function openLetterModal() { document.getElementById('letter-modal').classList.add('open'); }

async function confirmLetter() {
  const title = document.getElementById('let-title').value.trim();
  const content = document.getElementById('let-content').value.trim();
  const unlockDate = document.getElementById('let-date').value;
  if (!title || !content || !unlockDate) return;
  closeModal('letter-modal');

  const res = await fetch(`${API}/api/letters`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, content, unlockDate })
  });
  if (res.ok) {
    const l = await res.json();
    renderLetter(l);
    updateEmpty();
    showToast('mektup mühürlendi 💌');
  }
}

async function loadLetters() {
  const res = await fetch(`${API}/api/letters`);
  const letters = await res.json();
  letters.forEach(renderLetter);
}

function renderLetter(l) {
  const items = document.getElementById('board-items');
  const el = document.createElement('div');
  el.className = 'envelope-item';
  el.style.left = (Math.random() * 400 + 50) + 'px';
  el.style.top = (Math.random() * 300 + 50) + 'px';

  el.innerHTML = `
    <div class="envelope-box" onclick="openEnvelope('${esc(l.title)}', '${esc(l.content)}', '${l.unlockDate}')">
      💌 ${esc(l.title)}<br><span style="font-size:0.6rem;color:#777;">Açılış: ${l.unlockDate}</span>
    </div>
    <button class="env-del" onclick="delLetter('${l.id}', this)">✕</button>`;
  items.appendChild(el);
}

function openEnvelope(title, content, unlockDate) {
  const today = new Date().toISOString().split('T')[0];
  if (today < unlockDate) {
    alert(`Bu mektup henüz kilitli! 🔒 Açılacağı tarih: ${unlockDate}`);
  } else {
    alert(`💌 Mektup: ${title}\n\n${content}`);
  }
}

async function delLetter(id, btn) {
  await fetch(`${API}/api/letters/${id}`, { method: 'DELETE' });
  btn.closest('.envelope-item').remove();
  updateEmpty();
}

// ── COUNTDOWNS (Geri Sayımlar) ────────────────────────────────────────────────
function openCountdownModal() { document.getElementById('cd-modal').classList.add('open'); }

async function confirmCountdown() {
  const title = document.getElementById('cd-title').value.trim();
  const targetDate = document.getElementById('cd-date').value;
  if (!title || !targetDate) return;
  closeModal('cd-modal');

  const res = await fetch(`${API}/api/countdowns`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, targetDate })
  });
  if (res.ok) loadCountdowns();
}

async function loadCountdowns() {
  const res = await fetch(`${API}/api/countdowns`);
  const list = await res.json();
  const box = document.getElementById('countdown-list');
  box.innerHTML = '';
  list.forEach(c => {
    const daysLeft = Math.ceil((new Date(c.targetDate) - new Date()) / (1000 * 60 * 60 * 24));
    const div = document.createElement('div');
    div.className = 'mini-item';
    div.innerHTML = `<span><b>${esc(c.title)}</b>: ${daysLeft > 0 ? daysLeft + ' gün kaldı' : 'Zamanı geldi!'}</span> <button onclick="delCd('${c.id}')" style="background:none;border:none;color:#ff3d6b;cursor:pointer;">✕</button>`;
    box.appendChild(div);
  });
}

async function delCd(id) {
  await fetch(`${API}/api/countdowns/${id}`, { method: 'DELETE' });
  loadCountdowns();
}

// ── CAPSULES (Anı Kapsülü) ────────────────────────────────────────────────────
function openCapsuleModal() { document.getElementById('cap-modal').classList.add('open'); }

async function confirmCapsule() {
  const monthName = document.getElementById('cap-month').value.trim();
  const note = document.getElementById('cap-note').value.trim();
  if (!monthName || !note) return;
  closeModal('cap-modal');

  const res = await fetch(`${API}/api/capsules`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ monthName, note })
  });
  if (res.ok) showToast('Anı kapsülü mühürlendi 📦');
}

// ── AI CHAT ───────────────────────────────────────────────────────────────────
async function loadAiSettings() {
  const res = await fetch(`${API}/api/settings`);
  const data = await res.json();
  if (data.aiName) {
    aiName = data.aiName;
    document.getElementById('ai-title').textContent = '✦ ' + aiName;
  }
}

function openAiSettingsModal() {
  document.getElementById('ai-name-input').value = aiName;
  document.getElementById('ai-settings-modal').classList.add('open');
}

async function saveAiSettings() {
  const newName = document.getElementById('ai-name-input').value.trim();
  if (!newName) return;
  aiName = newName;
  document.getElementById('ai-title').textContent = '✦ ' + aiName;
  closeModal('ai-settings-modal');
  await fetch(`${API}/api/settings`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ aiName })
  });
}

async function sendAiMsg() {
  const input = document.getElementById('ai-input');
  const prompt = input.value.trim();
  if (!prompt) return;

  const chatBox = document.getElementById('ai-chat-box');
  chatBox.innerHTML += `<div class="ai-msg user">${esc(prompt)}</div>`;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  const loading = document.createElement('div');
  loading.className = 'ai-msg assistant';
  loading.textContent = 'Düşünüyor...';
  chatBox.appendChild(loading);

  const res = await fetch(`${API}/api/ai/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, aiName })
  });
  const data = await res.json();
  loading.innerHTML = esc(data.text) + (data.image ? `<br><img src="${data.image}">` : '');
  chatBox.scrollTop = chatBox.scrollHeight;
}

// Utils
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function updateEmpty() {
  const items = document.getElementById('board-items');
  const empty = document.getElementById('board-empty');
  empty.style.display = items.children.length > 1 ? 'none' : 'flex';
}
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
