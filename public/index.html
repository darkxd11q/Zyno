<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeynep World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #080810;
  --bg2:       #0e0e1a;
  --surface:   #18182c;
  --surface2:  #201e38;
  --border:    #2c2848;
  --accent:    #c4aaff;
  --accent2:   #7b5ef8;
  --accent3:   #ff6eb0;
  --text:      #ede8ff;
  --text2:     #9988cc;
  --text3:     #554e88;
  --pin:       #ff3d6b;
  --cork:      linear-gradient(135deg,#161628 0%,#1a1830 100%);
  --fd:        'Playfair Display', serif;
  --fh:        'Caveat', cursive;
  --fb:        'DM Sans', sans-serif;
  --bubble-bg: #1e1c34;
}
[data-theme="pastel"] {
  --bg: #fdf5f0; --bg2: #fef9f5; --surface: #fff6f1; --surface2: #ffe8de;
  --border: #f0cfc2; --accent: #d4789a; --text: #4a2e3c; --text2: #8a6070; --cork: linear-gradient(135deg,#fef0e8 0%,#fde8e0 100%);
}
[data-theme="minimal"] {
  --bg: #f6f5f2; --bg2: #fafaf8; --surface: #ffffff; --surface2: #f0efec;
  --border: #dddbd8; --accent: #1a1a1a; --text: #111111; --text2: #555555; --cork: linear-gradient(135deg,#edece8 0%,#e8e6e2 100%);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{ font-family:var(--fb); background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; padding-bottom:80px; }

header{
  position:sticky;top:0;z-index:200; height:58px;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid var(--border); backdrop-filter:blur(24px);
}
.logo{ font-family:var(--fd); font-size:1.3rem; font-style:italic; color:var(--text); display:flex;align-items:center;gap:6px; }
.logo em{color:var(--accent);font-style:normal;}

.theme-bar{ display:flex;align-items:center;gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:50px;padding:4px 6px; }
.th-btn{ border:none;cursor:pointer;border-radius:50px;padding:4px 10px; font-family:var(--fb);font-size:.65rem;font-weight:500; color:var(--text3);background:transparent;transition:all .25s; }
.th-btn.on{background:var(--accent);color:var(--bg);font-weight:700;}

/* RESPONSIVE GRID LAYOUT */
.wrapper{ display:grid; grid-template-columns:1fr 340px; min-height:calc(100vh - 138px); }
@media(max-width: 900px) {
  .wrapper { grid-template-columns: 1fr; }
  aside.sidebar { border-top: 1px solid var(--border); }
}

.board-col{ display:grid; grid-template-rows:1fr auto; border-right:1px solid var(--border); }
.corkboard{ padding:0; background:var(--cork); min-height:450px; position:relative; overflow:hidden; }
.board-items{ position:relative; width:100%; height:100%; min-height:500px; }
.board-empty{ position:absolute;inset:0; display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px; color:var(--text3);font-family:var(--fh);font-size:1.2rem; pointer-events:none; }

.pinned-photo, .q-bubble, .envelope-item, .add-zone { position: relative; overflow: hidden; z-index: 1; }
.pinned-photo::before, .q-bubble::before, .envelope-item::before, .add-zone::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: var(--fill-color, var(--accent)); opacity: 0.25;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: -1; pointer-events: none !important; border-radius: inherit;
}
.pinned-photo:active::before, .q-bubble:active::before, .envelope-item:active::before, .add-zone:active::before, .add-zone:hover::before { transform: translateX(100%); }

.pinned-photo { --fill-color: #ff3d6b; position: absolute; cursor: grab; width: 150px; }
.photo-frame{ background:#fff; padding:8px 8px 28px; transform:rotate(var(--rot)); box-shadow:3px 5px 18px rgba(0,0,0,.3); }
.photo-frame img, .photo-frame video { width:134px;height:134px;object-fit:cover;display:block; }
.photo-caption{ font-family:var(--fh);font-size:.78rem;color:#555;text-align:center;padding:4px 2px 0; }
.pin-tack{ position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:30; pointer-events:none; }
.pin-head{ width:12px;height:12px;background:radial-gradient(circle at 38% 32%,#ff99aa,var(--pin)); border-radius:50%; }
.pin-shaft{ width:2px;height:8px;background:#888;margin:0 auto; }
.photo-del, .q-del, .env-del{ position:absolute;top:-7px;right:-7px; width:22px;height:22px; background:#ff3d6b; border:none;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:40; }
.pinned-photo:hover .photo-del, .q-bubble:hover .q-del, .envelope-item:hover .env-del { display:flex; }

.q-bubble{ --fill-color: #7b5ef8; position: absolute; cursor: grab; background:var(--bubble-bg); border:1px solid var(--border); border-radius:20px; padding:14px 16px; max-width:240px; min-width:150px; }
.q-text{ font-family:var(--fh);font-size:1rem;color:var(--text); }
.q-footer{ display:flex;align-items:center;justify-content:space-between;margin-top:6px; }
.q-stars{ color:var(--accent3);font-size:.7rem; }

.envelope-box { --fill-color: #f4e8c1; background: #f4e8c1; color: #4a3b2c; padding: 10px 15px; border-radius: 6px; font-family: var(--fh); font-size: 1rem; text-align: center; width: 140px; cursor: pointer; }
.envelope-item { position: absolute; }

/* 2 BUTONLU DÜZENLİ TOOLBAR */
.add-zones{ display:grid; grid-template-columns: 1fr 1fr; border-top:1px solid var(--border); background:var(--bg2); position: relative; }
.add-zone{ height:60px; display:flex;flex-direction:column;align-items:center;justify-content:center; cursor:pointer; border:none; background:transparent;color:var(--text3); font-family:var(--fh); font-size:0.85rem; gap:3px; z-index:10; }
.add-zone * { pointer-events: none; }
.add-zone:first-child { border-right: 1px solid var(--border); --fill-color: #ff3d6b; }
.add-zone:last-child { --fill-color: #7b5ef8; }

/* 3 NOKTA AÇILIR MENÜ */
.menu-popup {
  position: absolute; bottom: 65px; right: 10px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px; display: none; flex-direction: column; gap: 6px; z-index: 300; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 160px;
}
.menu-popup.open { display: flex; }
.menu-item { background: transparent; border: none; padding: 8px 10px; text-align: left; color: var(--text); font-family: var(--fb); font-size: 0.75rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
.menu-item:hover { background: var(--surface2); color: var(--accent); }

aside.sidebar{ display:flex;flex-direction:column; background:var(--bg2);overflow-y:auto; }
.panel{ padding:14px; border-bottom:1px solid var(--border); }
.panel-title{ font-family:var(--fd);font-size:1rem;font-style:italic;color:var(--text);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center; }

.ambient-row{ display:flex; gap:6px; }
.amb-btn{ flex:1; padding:7px 4px; background:var(--surface); border:1px solid var(--border); border-radius:4px; font-size:0.7rem; color:var(--text2); cursor:pointer; text-align:center; }
.amb-btn.active { background: var(--accent); color: var(--bg); font-weight: 700; }

.mini-list{ max-height:100px; overflow-y:auto; display:flex;flex-direction:column;gap:5px; }
.mini-item{ background:var(--surface); border:1px solid var(--border); padding:6px 10px; border-radius:4px; font-size:0.72rem; display:flex;justify-content:space-between;align-items:center; }

/* BÜYÜTÜLEBİLİR AI PANELİ */
.ai-panel{ padding:14px; border-bottom:1px solid var(--border); display:flex;flex-direction:column; flex:1; transition: all 0.3s ease; }
.ai-panel.expanded { position: fixed; inset: 20px; z-index: 900; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,0.9); }
.ai-chat-box{ flex:1; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px; max-height:150px; overflow-y:auto; display:flex;flex-direction:column;gap:8px; margin-bottom:8px; }
.ai-panel.expanded .ai-chat-box { max-height: calc(100vh - 200px); }
.ai-msg{ font-size:0.75rem; padding:6px 8px; border-radius:6px; line-height:1.4; max-width:90%; word-break:break-word; }
.ai-msg.user{ background:var(--surface2); color:var(--text); align-self:flex-end; }
.ai-msg.assistant{ background:var(--surface); color:var(--text2); align-self:flex-start; border:1px solid var(--border); }
.ai-msg img { width: 100%; max-height: 120px; object-fit: cover; border-radius: 4px; margin-top: 4px; }
.ai-input-row{ display:flex; gap:5px; align-items:center; }
.ai-input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:6px; font-size:0.72rem; color:var(--text); outline:none; }
.ai-send-btn{ padding:6px 9px; background:var(--accent); border:none; border-radius:4px; color:var(--bg); font-weight:700; font-size:0.68rem; cursor:pointer; }

/* SPOTIFY BAR */
.spotify-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #121212; border-top: 1px solid #282828;
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 500; font-family: var(--fb); color: #fff;
}
.spotify-left { display: flex; align-items: center; gap: 10px; width: 220px; }
.spotify-thumb { width: 42px; height: 42px; background: #282828; border-radius: 4px; object-fit: cover; }
.spotify-meta { display: flex; flex-direction: column; overflow: hidden; }
.spotify-title { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spotify-artist { font-size: 0.65rem; color: #b3b3b3; }
.spotify-center { display: flex; align-items: center; gap: 12px; }
.spotify-btn { background: none; border: none; color: #b3b3b3; font-size: 0.9rem; cursor: pointer; transition: color 0.2s; }
.spotify-btn:hover { color: #fff; }
.spotify-btn.main { width: 30px; height: 30px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }
.spotify-right { display: flex; align-items: center; gap: 10px; }
.spotify-video-modal { position: fixed; bottom: 80px; right: 16px; width: 280px; height: 160px; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 600; display: none; }
.spotify-video-modal iframe { width: 100%; height: 100%; border: none; }

/* STORY MODAL */
.story-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1000; display:none; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(15px); }
.story-overlay.open { display:flex; }
.story-card { width: 320px; height: 540px; background: #111; border-radius: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
.story-progress-bar { display: flex; gap: 4px; padding: 12px 12px 0; position: absolute; top: 0; left: 0; right: 0; z-index: 20; }
.story-progress-step { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
.story-progress-fill { height: 100%; width: 0%; background: #fff; transition: width 0.1s linear; }
.story-content { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
.story-content img, .story-content video { width: 100%; height: 100%; object-fit: cover; }
.story-caption { position: absolute; bottom: 25px; left: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; backdrop-filter: blur(8px); color: #fff; font-family: var(--fh); font-size: 1.1rem; text-align: center; }
.story-nav-left, .story-nav-right { position: absolute; top: 0; bottom: 0; width: 45%; z-index: 10; cursor: pointer; }
.story-nav-left { left: 0; } .story-nav-right { right: 0; }
.story-close { position: absolute; top: 15px; right: 15px; color: #fff; font-size: 22px; cursor: pointer; z-index: 30; }

.overlay{ position:fixed;inset:0; background:rgba(0,0,0,.72); display:none;align-items:center;justify-content:center; z-index:700; backdrop-filter:blur(10px); }
.overlay.open{display:flex;}
.modal{ background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;width:320px; }
.modal h3{ font-family:var(--fd);font-size:1.1rem;font-style:italic;color:var(--text);margin-bottom:12px; }
.modal input,.modal textarea{ width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px; padding:8px;font-size:0.85rem;color:var(--text);outline:none;margin-bottom:8px;resize:none; }
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.m-cancel{ padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text2);cursor:pointer;font-size:0.7rem;}
.m-ok{ padding:6px 16px;background:var(--accent);border:none;border-radius:4px;color:var(--bg);font-weight:700;cursor:pointer;font-size:0.7rem;}

.search-results { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.search-item { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 5px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); }
.search-item:hover { background: var(--surface2); }
.search-item img { width: 36px; height: 26px; object-fit: cover; border-radius: 2px; }

.toast{ position:fixed;bottom:80px;right:20px; background:var(--surface);border:1px solid var(--border); border-radius:8px;padding:10px 14px;font-family:var(--fh);font-size:0.9rem;color:var(--text); z-index:1000;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body data-theme="midnight">

<header>
  <div class="logo"><span class="dot">✦</span>Zeynep <em>World</em></div>
  <div class="theme-bar">
    <button class="th-btn on" data-t="midnight" onclick="setTheme('midnight',this)">🌙 Midnight</button>
    <button class="th-btn" data-t="pastel" onclick="setTheme('pastel',this)">🌸 Pastel</button>
    <button class="th-btn" data-t="minimal" onclick="setTheme('minimal',this)">🤍 Minimal</button>
  </div>
</header>

<div class="wrapper">
  <div class="board-col">
    <div class="corkboard" id="corkboard">
      <div class="board-items" id="board-items">
        <div class="board-empty" id="board-empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>burası senin dünyan ✦</span>
        </div>
      </div>
    </div>

    <!-- DÜZENLİ TOOLBAR: FOTO/VİDEO TEK ALAN, DİĞERLERİ 3 NOKTADA -->
    <div class="add-zones">
      <button class="add-zone" onclick="triggerFileInput()">🎬 <span>Foto / Video Ekle</span></button>
      <button class="add-zone" onclick="toggleMenu(event)">••• <span>Diğer Seçenekler</span></button>
    </div>

    <!-- 3 NOKTA AÇILIR MENÜ -->
    <div class="menu-popup" id="menu-popup">
      <button class="menu-item" onclick="openQuoteModal(); closeMenu()">💬 Söz Ekle</button>
      <button class="menu-item" onclick="openLetterModal(); closeMenu()">💌 Mektup Bırak</button>
      <button class="menu-item" onclick="openCountdownModal(); closeMenu()">⏳ Geri Sayım</button>
      <button class="menu-item" onclick="openStoryCapsule(); closeMenu()">📦 Anı Kapsülü</button>
    </div>
  </div>

  <aside class="sidebar">
    <div class="panel">
      <h3 class="panel-title">🎵 Çalma Listesi <button onclick="openMusicModal()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:0.75rem;">+ Şarkı Ara</button></h3>
      <div class="mini-list" id="music-list"></div>
    </div>

    <div class="panel">
      <h3 class="panel-title">🎧 Ortam Sesleri</h3>
      <div class="ambient-row">
        <button class="amb-btn" id="btn-rain" onclick="toggleAmb('rain', this)">🌧️ Yağmur</button>
        <button class="amb-btn" id="btn-fire" onclick="toggleAmb('fire', this)">🔥 Şömine</button>
        <button class="amb-btn" id="btn-cafe" onclick="toggleAmb('cafe', this)">☕ Kafe</button>
      </div>
    </div>

    <div class="panel">
      <h3 class="panel-title">⏳ Geri Sayımlar</h3>
      <div class="mini-list" id="countdown-list"></div>
    </div>

    <!-- BÜYÜTÜLEBİLİR VE FOTOĞRAF YÜKLENEBİLİR YAPAY ZEKA PANELİ -->
    <div class="ai-panel" id="ai-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <h3 class="panel-title" id="ai-title" style="margin:0;">✦ 67</h3>
        <div style="display:flex;gap:6px;">
          <button onclick="toggleAiExpand()" id="ai-expand-btn" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.8rem;" title="Büyüt/Küçült">🗖</button>
          <button onclick="openAiSettingsModal()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.8rem;">⚙️</button>
        </div>
      </div>
      <div class="ai-chat-box" id="ai-chat-box">
        <div class="ai-msg assistant">Selam! Ben 67. Bana fotoğraf yükleyebilir, soru sorabilir ya da çizdirebilirsin ✦</div>
      </div>
